name: Deploy labeled pull request to MWAA dev

# Runs "Deploy DAGs to MWAA" on dev for the branch of a pull request into main when it gets
# the deploy-to-dev label, and on every later push while the label is on. The deploy runs
# as a workflow_dispatch from main, so this workflow never checks out pull request code.
# Pull requests from forks are skipped.
on:
  pull_request:
    types: [labeled, synchronize]
    branches:
      - main

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'deploy-to-dev')
      && (github.event.action == 'synchronize' || github.event.label.name == 'deploy-to-dev')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the MWAA deploy workflow for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: gh workflow run mwaa-dags.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$BRANCH"
