
name: Validate

on: # Run on new commits and PR openings
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, reopened]

env:
  RUFF_VERSION: "0.15.20"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the MWAA Airflow and Python versions from mwaa/constraints.txt
        id: versions
        run: bash scripts/mwaa_versions.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Install the MWAA Airflow version and requirements
        env:
          AIRFLOW_VERSION: ${{ steps.versions.outputs.airflow }}
        run: |
          pip install --only-binary :all: \
            "apache-airflow[amazon,celery,snowflake]==${AIRFLOW_VERSION}" \
            -r requirements-airflow.txt -r requirements-dev.txt \
            -c mwaa/constraints.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ruff
        run: pip install "ruff==${{ env.RUFF_VERSION }}"

      # AIR3 = Ruff's Airflow 3.x deprecation/removal rules (e.g. schedule_interval,
      # execution_date). Catches DAG code that uses APIs Airflow 3 removed or deprecated.
      - name: Lint changed DAGs for Airflow 3 deprecations
        continue-on-error: true
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH="main"
          fi

          git fetch origin "$BASE_BRANCH"

          files=$(git diff --name-only "origin/$BASE_BRANCH"...HEAD -- 'dags/**/*.py' 'dags/*.py')

          if [ -n "$files" ]; then
            ruff check $files --select AIR3 --output-format=github
          else
            echo "No changed DAG files to lint."
          fi
